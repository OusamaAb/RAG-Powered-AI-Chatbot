<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ousama Alabdullah — Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@300..600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="chat.css" />
  <script>
    // Apply persisted theme + accent before React mounts to prevent a flash.
    try {
      var raw = localStorage.getItem("ousama:tweaks");
      if (raw) {
        var t = JSON.parse(raw);
        if (t && typeof t.dark === "boolean") {
          document.documentElement.dataset.theme = t.dark ? "dark" : "light";
        }
        if (t && typeof t.accent === "string") {
          document.documentElement.style.setProperty("--accent", t.accent);
        }
      }
    } catch (e) {}
  </script>
  <script>
    if (window.location.hostname === "ousamaab.github.io") {
      window.OUSAMA_CHAT_API_URL = "https://ousama-rag-chatbot-backend.onrender.com/api/chat";
    }
  </script>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="../image-slot.js"></script>
  <script src="../profile.js"></script>
  <script type="text/babel" src="../chatbot.jsx"></script>
  <script type="text/babel" src="../shared/tweaks-panel.jsx"></script>
  <script type="text/babel" src="sections.jsx"></script>
  <script type="text/babel" src="chat.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
